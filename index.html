<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315e58"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="秀谷助理排休"><link rel="manifest" href="manifest.webmanifest"><title>秀谷 助理排休</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#213b38;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#315e58;color:white;padding:22px 18px 18px}header h1{font-size:23px;margin:0 0 5px}header small{opacity:.85}.wrap{max-width:900px;margin:auto;padding:16px}.notice{background:#fff4db;color:#775018;padding:12px;border-radius:12px;font-size:13px;margin-bottom:14px}.panel{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #23433b0a}.flex{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;background:#315e58;color:white;cursor:pointer}button.secondary{background:#e7efeb;color:#315e58}button.danger{background:#fae8e6;color:#a23c31}input,select{padding:10px;border:1px solid #d5dfd9;border-radius:9px;max-width:100%;background:white}h2{font-size:17px;margin:0 0 13px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:#6b8179;font-size:12px;padding:8px 0}.day{min-height:76px;background:#f5f8f6;border:1px solid #e2eae5;border-radius:10px;padding:7px 4px;text-align:left;color:#213b38;display:flex;flex-direction:column;align-items:flex-start;gap:5px}.day.muted{visibility:hidden}.day.selected{outline:2px solid #315e58}.day .count{font-size:11px;color:#658078}.day.full{background:#fff0ed}.pill{font-size:11px;border-radius:20px;padding:3px 7px;background:#e5f2ed;color:#276348;display:inline-block}.pending{background:#fff2d8;color:#8b641e}.rejected{background:#fae7e5;color:#a23c31}.entry{padding:10px 0;border-bottom:1px solid #e9eeea}.entry:last-child{border:0}.entry small{color:#647a72}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.fields label{display:flex;flex-direction:column;gap:5px;font-size:13px}.fields input,.fields select{width:100%}.empty{color:#75877f;font-size:14px}.foot{color:#778b82;text-align:center;font-size:12px;margin:18px 0 28px}@media(max-width:550px){.wrap{padding:10px}.panel{padding:12px}.day{min-height:65px;padding:5px 3px}.day .count{font-size:10px}.fields{grid-template-columns:1fr}button{padding:9px 10px}}</style></head><body><header><div style="max-width:900px;margin:auto"><h1>秀谷 助理排休</h1><small>排休月曆・申請管理・額度統計</small></div></header><main class="wrap"><div class="notice">測試版本：資料只保存在目前這台裝置的瀏覽器。尚未連接 Supabase，請勿用來正式收集員工資料或當作多人同步排休系統。</div><section class="panel"><div class="flex"><button class="secondary" id="prev">‹ 上個月</button><h2 id="month" style="margin:0"></h2><button class="secondary" id="next">下個月 ›</button></div><div id="calendar" class="calendar" style="margin-top:13px"></div></section><section class="panel"><div class="flex"><h2 id="selectedTitle">當日排休</h2><label style="font-size:13px">每日名額 <input id="dailyLimit" type="number" min="1" max="99" value="2" style="width:75px"></label></div><div id="dayEntries"></div><div class="fields" style="margin-top:14px"><label>員工<select id="employee"></select></label><label>假別<select id="leaveType"><option value="排休">排休</option><option value="特休">特休</option><option value="事假">事假</option><option value="病假">病假</option></select></label></div><div class="controls"><button id="apply">新增排休申請</button></div><p style="font-size:12px;color:#75877f">一般排休達當日名額時停止新增；其他假別可申請，由管理員自行判斷。此版所有操作皆為本機模擬管理員。</p></section><section class="panel"><h2>員工與月休額度</h2><div class="fields"><label>員工姓名<input id="newEmployee" placeholder="輸入員工姓名"></label><label>每月休假額度<input id="newQuota" type="number" min="0" max="31" value="10"></label></div><div class="controls"><button id="addEmployee">新增員工</button></div><div id="employees" style="margin-top:12px"></div></section><section class="panel"><div class="flex"><h2>本月申請紀錄</h2><button class="secondary" id="export">匯出本月 CSV</button></div><div id="requests"></div></section><div class="foot">秀谷 助理排休 · 免費測試版 v1.0</div></main><script>
const KEY='xiugu-leave-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.employees)||!Array.isArray(state.requests))state={employees:[],requests:[],dailyLimit:2};const now=new Date();let year=now.getFullYear(),month=now.getMonth(),selected=fmt(year,month,now.getDate());const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));function fmt(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function monthRequests(){return state.requests.filter(r=>r.date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`))}function count(date){return state.requests.filter(r=>r.date===date&&r.status==='核准'&&r.type==='排休').length}function render(){const limit=state.dailyLimit||2;$('dailyLimit').value=limit;$('month').textContent=`${year} 年 ${month+1} 月`;$('selectedTitle').textContent=`${selected} 排休`;const cal=$('calendar');cal.innerHTML=['日','一','二','三','四','五','六'].map(x=>`<div class="weekday">${x}</div>`).join('');let first=new Date(year,month,1).getDay(),total=new Date(year,month+1,0).getDate();for(let i=0;i<first;i++)cal.innerHTML+='<div class="day muted"></div>';for(let d=1;d<=total;d++){const date=fmt(year,month,d),n=count(date),pending=state.requests.filter(r=>r.date===date&&r.status==='待審核').length;cal.innerHTML+=`<button class="day ${date===selected?'selected':''} ${n>=limit?'full':''}" data-date="${date}"><b>${d}</b><span class="count">已核 ${n}/${limit}</span>${pending?`<span class="count">待審 ${pending}</span>`:''}</button>`}cal.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()});$('employee').innerHTML=state.employees.length?state.employees.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join(''):'<option value="">請先新增員工</option>';$('dayEntries').innerHTML=state.requests.filter(r=>r.date===selected).map(entryHtml).join('')||'<p class="empty">當天尚無申請</p>';$('employees').innerHTML=state.employees.map(e=>{const req=monthRequests().filter(r=>r.employeeId===e.id&&r.status==='核准');return `<div class="entry flex"><div><b>${escapeHtml(e.name)}</b> <small>本月已核准 ${req.length} / ${e.quota} 天</small></div><button class="danger" data-remove="${e.id}">刪除</button></div>`}).join('')||'<p class="empty">尚無員工，請先新增</p>';$('requests').innerHTML=monthRequests().sort((a,b)=>a.date.localeCompare(b.date)).map(r=>`<div class="entry"><b>${escapeHtml(r.date)}</b> · ${escapeHtml(employeeName(r.employeeId))} · ${escapeHtml(r.type)} <span class="pill ${r.status==='待審核'?'pending':r.status==='拒絕'?'rejected':''}">${r.status}</span>${r.status==='待審核'?`<div class="controls"><button data-approve="${r.id}">核准</button><button class="danger" data-reject="${r.id}">拒絕</button></div>`:''}</div>`).join('')||'<p class="empty">本月尚無申請</p>';document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>setStatus(b.dataset.approve,'核准'));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>setStatus(b.dataset.reject,'拒絕'));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const id=b.dataset.remove;if(state.requests.some(r=>r.employeeId===id)){alert('此員工已有申請紀錄，為保留紀錄無法刪除。');return}if(confirm('確定刪除此員工？')){state.employees=state.employees.filter(e=>e.id!==id);save();render()}})}function employeeName(id){return state.employees.find(e=>e.id===id)?.name||'已移除員工'}function entryHtml(r){return `<div class="entry"><b>${escapeHtml(employeeName(r.employeeId))}</b> · ${escapeHtml(r.type)} <span class="pill ${r.status==='待審核'?'pending':r.status==='拒絕'?'rejected':''}">${r.status}</span>${r.status==='待審核'?`<div class="controls"><button data-approve="${r.id}">核准</button><button class="danger" data-reject="${r.id}">拒絕</button></div>`:''}</div>`}function setStatus(id,status){const r=state.requests.find(x=>x.id===id);if(!r)return;if(status==='核准'&&r.type==='排休'&&count(r.date)>=state.dailyLimit){alert('當日核准排休已達名額');return}if(status==='核准'){const emp=state.employees.find(e=>e.id===r.employeeId);const used=state.requests.filter(x=>x.employeeId===r.employeeId&&x.status==='核准'&&x.date.slice(0,7)===r.date.slice(0,7)).length;if(emp&&used>=emp.quota&&!confirm('此員工已達本月額度，仍要核准嗎？'))return}r.status=status;save();render()}$('prev').onclick=()=>{month--;if(month<0){month=11;year--}selected=fmt(year,month,1);render()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}selected=fmt(year,month,1);render()};$('dailyLimit').onchange=()=>{const v=Number($('dailyLimit').value);if(!Number.isInteger(v)||v<1||v>99){alert('名額需為 1 到 99');render();return}state.dailyLimit=v;save();render()};$('addEmployee').onclick=()=>{const name=$('newEmployee').value.trim(),quota=Number($('newQuota').value);if(!name||!Number.isInteger(quota)||quota<0||quota>31){alert('請輸入姓名與正確休假額度');return}if(state.employees.some(e=>e.name===name)){alert('已有同名員工');return}state.employees.push({id:crypto.randomUUID(),name,quota});$('newEmployee').value='';save();render()};$('apply').onclick=()=>{const employeeId=$('employee').value,type=$('leaveType').value;if(!employeeId){alert('請先新增員工');return}if(state.requests.some(r=>r.date===selected&&r.employeeId===employeeId&&r.status!=='拒絕')){alert('這位員工當天已有申請');return}if(type==='排休'&&count(selected)>=state.dailyLimit){alert('當日排休名額已滿');return}state.requests.push({id:crypto.randomUUID(),employeeId,date:selected,type,status:'待審核'});save();render()};$('export').onclick=()=>{const rows=[['日期','員工','假別','狀態'],...monthRequests().map(r=>[r.date,employeeName(r.employeeId),r.type,r.status])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`秀谷排休-${year}-${String(month+1).padStart(2,'0')}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
